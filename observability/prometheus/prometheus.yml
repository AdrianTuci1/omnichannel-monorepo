# Prometheus — configurare scraping pentru Omnichannel
# Consultă observability/README.md pentru pași de acces și contractul de metrice.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus se scrapează pe sine (metrice interne + health).
  - job_name: prometheus
    static_configs:
      - targets:
          - 'localhost:9090'

  # Store API — expune GET /metrics (Prometheus text format) pe :5180.
  # Endpoint-ul este implementat de backend3_worker (faza 2, OpenTelemetry +
  # exporter Prometheus). Până atunci target-ul apare "DOWN" în UI — normal.
  - job_name: store-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'store-api:5180'

  # OpenTelemetry Collector — expune metricele primite prin OTLP (gRPC/HTTP)
  # pe portul 8889, în format Prometheus, prin exporter-ul `prometheus`.
  - job_name: otel-collector
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'otel-collector:8889'
