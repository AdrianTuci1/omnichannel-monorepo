version: 2

models:
  - name: bronze_orders
    description: Oglindă raw a tabelului orders (comenzi) din store-api, cu timestamp de încărcare.
    columns:
      - name: order_id
        tests: ["not_null", "unique"]
      - name: order_number
        tests: ["not_null", "unique"]
      - name: customer_id
        tests: ["not_null"]
      - name: status
        description: OrderStatus ca integer (1..6).

  - name: bronze_order_lines
    description: Oglindă raw a tabelului order_lines din store-api.
    columns:
      - name: order_line_id
        tests: ["not_null", "unique"]
      - name: order_id
        tests: ["not_null"]
      - name: product_id
        tests: ["not_null"]
      - name: quantity
        tests: ["not_null"]

  - name: bronze_products
    description: Oglindă raw a tabelului products din store-api.
    columns:
      - name: product_id
        tests: ["not_null", "unique"]
      - name: sku
        tests: ["not_null", "unique"]
      - name: name
        tests: ["not_null"]

  - name: bronze_categories
    description: Oglindă raw a tabelului categories din store-api.
    columns:
      - name: category_id
        tests: ["not_null", "unique"]

  - name: bronze_customers
    description: Oglindă raw a tabelului customers din store-api.
    columns:
      - name: customer_id
        tests: ["not_null", "unique"]
      - name: email
        tests: ["not_null", "unique"]

  - name: bronze_inventory
    description: Oglindă raw a tabelului inventory din store-api.
    columns:
      - name: product_id
        tests: ["not_null", "unique"]
